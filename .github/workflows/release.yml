name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and verify translation dictionaries
        run: npm run build

      - name: Verify tests and clean committed dictionaries
        run: |
          git diff --exit-code -- data/merged-dict.json data/dict-norm.json
          npm run verify

      - name: Build installable VSIX
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: claude-code-zhcn-vsix
          path: claude-code-zhcn-*.vsix
          if-no-files-found: error

      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: claude-code-zhcn-*.vsix
          generate_release_notes: true
